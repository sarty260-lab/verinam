<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b5d4b">
<title>VeriNam v5</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--text:#15231f;--muted:#66736f;--line:#dde5e2;--brand:#0b5d4b;--soft:#eaf5f1;--nav:#073d33;--ok:#067647;--okbg:#ecfdf3;--warn:#946200;--warnbg:#fff7db;--bad:#b42318;--badbg:#fef3f2;--shadow:0 8px 28px rgba(15,35,29,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.login-card{width:min(480px,100%);padding:28px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}.field{margin:13px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.primary,.secondary,.danger{padding:10px 14px;border-radius:10px;font-weight:750;border:0}.primary{background:var(--brand);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:#34413d}.danger{background:var(--bad);color:#fff}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--nav);color:#fff;padding:22px 15px;position:sticky;top:0;height:100vh}.sidebar .logo{background:#fff;color:var(--nav)}.nav{margin-top:27px;display:flex;flex-direction:column;gap:6px}.nav button{border:0;background:transparent;color:#c7d8d2;text-align:left;padding:11px 12px;border-radius:10px}.nav button:hover,.nav button.active{background:rgba(255,255,255,.11);color:#fff}.content{min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 24px;position:sticky;top:0;z-index:4}.meta{font-size:12px;color:var(--muted);text-align:right}.main{padding:26px;max-width:1450px;margin:auto}
.title{font-size:28px;margin:0 0 5px}.subtitle,.muted{color:var(--muted)}.subtitle{margin:0 0 21px}.grid{display:grid;gap:17px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{padding:19px}.card h3{margin-top:0}.kpi{font-size:22px;font-weight:800;margin-top:5px}
.search{display:grid;grid-template-columns:1fr auto;gap:9px}.search input{padding:12px;border:1px solid var(--line);border-radius:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.label{font-size:12px;color:var(--muted)}.value{font-weight:750;margin-top:3px}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.info{background:var(--soft);color:var(--brand)}
.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:17px 0}.tabs button{background:#fff;border:1px solid var(--line);padding:8px 11px;border-radius:9px;color:#52605c}.tabs button.active{background:var(--soft);color:var(--brand);font-weight:750}.alert,.success,.restricted{padding:14px;border-radius:12px}.alert{background:var(--warnbg);border:1px solid #eed28a;color:#765000}.success{background:var(--okbg);border:1px solid #abefc6;color:var(--ok)}.restricted{background:#fafafa;border:1px dashed #c7d0cd;color:var(--muted)}
.queue-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px}.queue-top,.patient-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.steps{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}.step{padding:5px 8px;border-radius:8px;background:#f2f4f3;color:#6b7773;font-size:11px;font-weight:750}.step.current{background:var(--soft);color:var(--brand);outline:1px solid #a8d3c6}.step.done{background:var(--okbg);color:var(--ok)}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);font-size:14px;text-align:left;white-space:nowrap}th{background:#fafafa;color:var(--muted)}.clinical{background:linear-gradient(135deg,#0b5d4b,#0a735b);color:#fff;border-radius:18px;padding:20px;margin-bottom:17px}.clinical .muted{color:#d6ebe4}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.profile-card{border:1px solid var(--line);border-radius:13px;padding:14px;margin:9px 0;background:#fff}
@media(max-width:950px){.shell{grid-template-columns:1fr}.sidebar{display:none}.g4,.g3,.g2,.formgrid{grid-template-columns:1fr}.main{padding:17px}.top{padding:0 15px}.patient-head,.queue-top{flex-direction:column}.search{grid-template-columns:1fr}}
</style>
</head>

function getPatients(){try{var x=JSON.parse(localStorage.getItem("verinam_v5_patients")||"null");return x||seedPatients}catch(e){return seedPatients}}
var P=getPatients();function savePatients(){localStorage.setItem("verinam_v5_patients",JSON.stringify(P))}
function getQ(){try{return JSON.parse(localStorage.getItem("verinam_v5_queue")||"[]")}catch(e){return[]}}function saveQ(q){localStorage.setItem("verinam_v5_queue",JSON.stringify(q))}
var roles={receptionist:"Receptionist",nurse:"Nurse / Clinician",doctor:"Doctor",billing:"Billing Officer",admin:"System Administrator"};
var S={user:null,page:"dashboard",patient:null,enc:null,tab:"summary",audit:[]};
function E(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function log(a){if(S.user)S.audit.unshift([new Date().toLocaleString(),S.user.name,roles[S.user.role],a])}
function fld(id,l,v){return '<div class="field"><label>'+E(l)+'</label><input id="'+id+'" value="'+E(v||"")+'"></div>'}
function sel(id,l,a){var s='<div class="field"><label>'+E(l)+'</label><select id="'+id+'">';a.forEach(function(x){s+='<option>'+E(x)+'</option>'});return s+'</select></div>'}
function render(){document.getElementById("app").innerHTML=S.user?shell():login()}
function login(){return '<div class="login"><div class="login-card"><div class="brand"><div class="logo">V</div><div><b>VeriNam</b><div class="muted">Healthcare prototype v5</div></div></div><h1>Secure access</h1>'+fld("ln","Name","Demo User")+'<div class="field"><label>Role</label><select id="lr"><option value="receptionist">Receptionist</option><option value="nurse">Nurse / Clinician</option><option value="doctor">Doctor</option><option value="billing">Billing Officer</option><option value="admin">System Administrator</option></select></div><div class="field"><label>Facility</label><select id="lf"><option>Windhoek Central Hospital</option><option>Oshakati Intermediate Hospital</option><option>Rundu Intermediate Hospital</option><option>Walvis Bay State Hospital</option><option>Small Community Clinic</option></select></div><button class="primary" style="width:100%" onclick="signin()">Sign in</button></div></div>'}
window.signin=function(){S.user={name:document.getElementById("ln").value||"Demo User",role:document.getElementById("lr").value,facility:document.getElementById("lf").value};log("Signed in");S.page=S.user.role==="billing"?"billing":(S.user.role==="doctor"?"queue":"dashboard");render()}
function shell(){return '<div class="shell">'+side()+'<section class="content"><header class="top"><div><b>VeriNam</b><div class="muted" style="font-size:12px">Flexible care · linked identity · role-based access</div></div><div class="meta">'+E(S.user.name)+'<br>'+E(roles[S.user.role])+' · '+E(S.user.facility)+'</div></header><main class="main">'+page()+'</main></section></div>'}
function side(){var n=nav("dashboard","Dashboard")+nav("find","Scan / Find Patient")+nav("queue","Today's Encounters");if(S.user.role==="receptionist"||S.user.role==="admin")n+=nav("register","Create New Patient");if(S.user.role==="billing")n+=nav("billing","Billing Dashboard");n+=nav("audit","Audit Log")+'<button onclick="logout()">Sign out</button>';return '<aside class="sidebar"><div class="brand"><div class="logo">V</div><b>VeriNam</b></div><div class="nav">'+n+'</div></aside>'}
function nav(p,t){return '<button class="'+(S.page===p?"active":"")+'" onclick="go(''+p+'')">'+t+'</button>'}window.go=function(p){S.page=p;render()}window.logout=function(){S={user:null,page:"dashboard",patient:null,enc:null,tab:"summary",audit:S.audit};render()}
function page(){if(S.page==="find")return find();if(S.page==="queue")return queue();if(S.page==="patient")return patient();if(S.page==="clinical")return clinical();if(S.page==="register")return register();if(S.page==="billing")return billing();if(S.page==="audit")return audit();return dash()}
function facilityQ(){return getQ().filter(function(x){return x.facility===S.user.facility})}
function dash(){var q=facilityQ();return '<h1 class="title">'+(S.user.role==="nurse"?"Nurse / Clinic Dashboard":"Healthcare Dashboard")+'</h1><p class="subtitle">'+E(S.user.facility)+'</p><div class="grid g4">'+kpi("Open encounters",q.filter(function(x){return x.status!=="Completed"}).length)+kpi("Ready for clinician",q.filter(function(x){return x.status==="Ready for Clinician"}).length)+kpi("With clinician",q.filter(function(x){return x.status==="With Clinician"}).length)+kpi("Completed",q.filter(function(x){return x.status==="Completed"}).length)+'</div><div class="grid g2" style="margin-top:17px"><div class="card"><h3>Find patient</h3><div class="search"><input id="dq" placeholder="ID / passport / birth record / VeriNam ID"><button class="primary" onclick="lookup('dq')">Find</button></div><p class="muted">Try: 90051400123, P99887766, BR-2022-00088, 76010100111, 92030300444, NL4400221, TOURIST8891, 55070700999</p></div><div class="card"><h3>Flexible care pathways</h3><p class="muted">A nurse can open, assess, treat and complete an encounter without a doctor. Cases can also be escalated to a doctor when required.</p><button class="secondary" onclick="go('queue')">Open encounters</button></div></div>'}
function kpi(a,b){return '<div class="card"><div class="muted">'+E(a)+'</div><div class="kpi">'+E(b)+'</div></div>'}
function find(){return '<h1 class="title">Scan / Find Patient</h1><p class="subtitle">Search across supported identity types.</p><div class="card"><div class="search"><input id="fq" placeholder="Identifier or VeriNam ID"><button class="primary" onclick="lookup('fq')">Search</button></div></div>'}
window.lookup=function(id){var q=document.getElementById(id).value.trim(),p=P[q];if(!p){Object.keys(P).some(function(k){if(P[k].vn===q){p=P[k];return true}})}if(!p){if(S.user.role==="receptionist"||S.user.role==="admin"){S.newIdentifier=q;S.page="register";render()}else alert("No matching patient. Reception can create a new profile.");return}S.patient=p;S.tab="summary";log("Opened "+p.vn);S.page="patient";render()}
function patient(){var p=S.patient;if(!p)return '<div class="restricted">No patient selected.</div>';var tabs='<div class="tabs">'+tab("summary","Summary")+tab("family","Dependants / Guardian")+(S.user.role==="billing"?tab("billing","Billing"):"")+'</div>';return '<div class="patient-head"><div><h1 class="title">'+E(p.name)+'</h1><p class="subtitle">'+E(p.vn)+' · '+E(p.idType)+' '+E(p.id)+' · '+E(p.dob)+' · '+E(p.nationality)+'</p></div><span class="badge ok">Profile active</span></div>'+tabs+patientTab(p)}
function tab(x,t){return '<button class="'+(S.tab===x?"active":"")+'" onclick="setTab(''+x+'')">'+t+'</button>'}window.setTab=function(x){S.tab=x;render()}
function patientTab(p){if(S.tab==="family")return family(p);if(S.tab==="billing")return billingCard(p);var s='<div class="grid g2"><div class="card"><h3>Identity & contact</h3>'+info("Residence status",p.residence)+info("Phone",p.phone)+info("Town",p.town)+info("Emergency contact",p.emergency)+'</div><div class="card"><h3>Coverage summary</h3>'+info("Funding",p.coverage.type)+info("Provider",p.coverage.provider)+info("Coverage status",p.coverage.verified)+'</div></div>';if(S.user.role==="receptionist")s+='<div class="card" style="margin-top:17px"><h3>Start today’s visit</h3>'+visitForm(p,false)+'</div>';if(S.user.role==="nurse")s+='<div class="card" style="margin-top:17px"><h3>Nurse-led care</h3><p class="muted">At a small clinic the nurse can start the encounter directly, assess/treat, and complete it without routing to a doctor.</p>'+visitForm(p,true)+'</div>';if(S.user.role==="doctor")s+='<div class="restricted" style="margin-top:17px">Open the patient from Today’s Encounters when they are ready for a doctor.</div>';return s}
function info(a,b){return '<div class="row"><div><div class="label">'+E(a)+'</div><div class="value">'+E(b)+'</div></div></div>'}
function visitForm(p,nurse){return '<div class="field"><label>Reason for visit</label><input id="reason" value="General consultation"></div><button class="primary" onclick="startVisit('+nurse+')">'+(nurse?"Start nurse-led encounter":"Check in patient")+'</button>'}
window.startVisit=function(nurse){var q=getQ(),e={id:"ENC-"+Date.now(),patientId:S.patient.id,vn:S.patient.vn,name:S.patient.name,facility:S.user.facility,reason:document.getElementById("reason").value||"General consultation",status:nurse?"With Clinician":"Checked In",path:nurse?"Nurse-led":"Hospital",created:new Date().toLocaleString()};q.push(e);saveQ(q);S.enc=e.id;log("Started "+e.path+" encounter for "+e.vn);if(nurse){S.page="clinical"}else S.page="queue";render()}
function family(p){var s='<div class="grid g2"><div class="card"><h3>Dependants</h3>';if(p.dependants&&p.dependants.length){p.dependants.forEach(function(d){var c=P[d.id];s+='<div class="profile-card"><b>'+E(c.name)+'</b><div class="muted">'+E(d.relationship)+' · '+E(c.dob)+' · '+E(c.vn)+'</div><button class="secondary" style="margin-top:9px" onclick="openPatient(''+E(c.id)+'')">Open dependant</button></div>'})}else s+='<div class="muted">No linked dependants.</div>';s+='</div><div class="card"><h3>Guardian / responsible adult</h3>';if(p.guardian){var g=P[p.guardian.id];s+=info("Name",g.name)+info("Relationship",p.guardian.relationship)+info("VeriNam ID",g.vn)+'<button class="secondary" onclick="openPatient(''+E(g.id)+'')">Open guardian</button>'}else s+='<div class="muted">No guardian recorded.</div>';return s+'</div></div>'}
window.openPatient=function(id){S.patient=P[id];S.tab="summary";render()}
function queue(){var q=facilityQ(),s='<h1 class="title">Today’s Encounters</h1><p class="subtitle">The workflow adapts to the available staff and care pathway.</p>';if(!q.length)return s+'<div class="card muted">No encounters at this facility yet.</div>';q.forEach(function(e){s+='<div class="queue-card"><div class="queue-top"><div><div class="value">'+E(e.name)+'</div><div class="label">'+E(e.vn)+' · '+E(e.reason)+' · '+E(e.path)+'</div></div><span class="badge '+(e.status==="Completed"?"ok":"info")+'">'+E(e.status)+'</span></div><div class="steps">'+steps(e)+'</div><div class="actions" style="margin-top:12px">'+actions(e)+'</div></div>'});return s}
function steps(e){var a=e.path==="Nurse-led"?["With Clinician","Completed"]:["Checked In","Triage","Ready for Clinician","With Clinician","Completed"],i=a.indexOf(e.status),s="";a.forEach(function(x,n){s+='<span class="step '+(n<i?"done":n===i?"current":"")+'">'+E(x)+'</span>'});return s}
function actions(e){if(e.status==="Completed")return '<span class="muted">Encounter completed.</span>';if(S.user.role==="nurse"){if(e.status==="Checked In")return '<button class="primary" onclick="status(''+e.id+'','Triage')">Start triage</button><button class="secondary" onclick="openClinical(''+e.id+'')">Treat directly</button>';if(e.status==="Triage")return '<button class="primary" onclick="openClinical(''+e.id+'')">Treat patient</button><button class="secondary" onclick="status(''+e.id+'','Ready for Clinician')">Escalate to doctor</button>';if(e.status==="Ready for Clinician")return '<span class="muted">Waiting for doctor.</span>';if(e.status==="With Clinician")return '<button class="primary" onclick="openClinical(''+e.id+'')">Continue care</button>'}if(S.user.role==="doctor"&&e.status==="Ready for Clinician")return '<button class="primary" onclick="openClinical(''+e.id+'')">Open Clinical View</button>';if(S.user.role==="doctor"&&e.status==="With Clinician")return '<button class="primary" onclick="openClinical(''+e.id+'')">Continue Clinical View</button>';return '<span class="muted">Waiting for next authorised step.</span>'}
window.status=function(id,st){var q=getQ();q.forEach(function(e){if(e.id===id)e.status=st});saveQ(q);log(id+" → "+st);render()}
window.openClinical=function(id){var q=getQ(),e;q.forEach(function(x){if(x.id===id){e=x;x.status="With Clinician"}});saveQ(q);if(!e)return;S.enc=id;S.patient=P[e.patientId];S.page="clinical";log("Clinical view "+e.vn);render()}
function clinical(){var p=S.patient,e=getQ().filter(function(x){return x.id===S.enc})[0];if(!p||!e)return '<div class="restricted">No encounter selected.</div>';return '<div class="clinical"><div class="muted">CLINICAL VIEW · '+E(e.path.toUpperCase())+'</div><h1 style="margin:5px 0">'+E(p.name)+'</h1><div>'+E(p.vn)+' · '+E(e.reason)+'</div></div><div class="grid g3"><div class="card"><h3>Safety summary</h3>'+info("Allergies",p.allergies.join(", ")||"None recorded")+info("Conditions",p.conditions.join(", ")||"None recorded")+info("Medication",p.meds.join(", ")||"None recorded")+'</div><div class="card"><h3>Recent labs</h3>'+list(p.labs)+'</div><div class="card"><h3>Assessment / treatment</h3><div class="field"><label>Clinical note</label><textarea id="note" rows="5"></textarea></div></div></div><div class="card" style="margin-top:17px"><h3>Previous encounters</h3><div class="tablewrap"><table><tr><th>Date</th><th>Facility</th><th>Reason</th><th>Diagnosis</th></tr>'+hist(p)+'</table></div><div class="actions" style="margin-top:14px">'+(S.user.role==="nurse"?'<button class="secondary" onclick="escalate()">Escalate to doctor</button>':'')+'<button class="primary" onclick="complete()">Treat & Complete</button></div></div>'}
function list(a){if(!a.length)return '<div class="muted">No recent results.</div>';return a.map(function(x){return '<div class="row">'+E(x)+'</div>'}).join("")}
function hist(p){return p.history.map(function(h){return '<tr><td>'+E(h[0])+'</td><td>'+E(h[1])+'</td><td>'+E(h[2])+'</td><td>'+E(h[3])+'</td></tr>'}).join("")}
window.escalate=function(){var q=getQ();q.forEach(function(e){if(e.id===S.enc)e.status="Ready for Clinician"});saveQ(q);log("Escalated "+S.patient.vn+" to doctor");S.page="queue";render()}
window.complete=function(){var q=getQ();q.forEach(function(e){if(e.id===S.enc){e.status="Completed";e.completed=new Date().toLocaleString();e.note=document.getElementById("note").value||""}});saveQ(q);log("Completed "+S.patient.vn);S.page="queue";render()}
function register(){return '<h1 class="title">Create New Patient</h1><p class="subtitle">First-time registration generates a VeriNam ID and stores the profile on this browser for testing.</p><div class="card"><div class="formgrid">'+fld("nid","Identity / document number",S.newIdentifier||"")+sel("ntype","Identity type",["Namibian ID","Passport","Birth record","Residence document","Temporary / no document"])+fld("nname","Full legal name","")+fld("ndob","Date of birth","")+fld("nnat","Nationality","Namibian")+fld("nres","Residence status","Citizen")+fld("nphone","Phone","")+fld("ntown","Town / address","")+sel("nfund","Funding",["State patient","No insurance / public patient","PSEMAS","Private medical aid","Self-pay","Foreign/travel insurance","Unknown"])+fld("nprovider","Provider / scheme","")+'</div><button class="primary" onclick="createPatient()">Create VeriNam profile</button></div>'}
window.createPatient=function(){var id=document.getElementById("nid").value.trim()||("TMP-"+Date.now());if(P[id]){alert("That identifier already exists.");return}var vn="VN-"+String(Math.floor(10000000+Math.random()*89999999)),p={vn:vn,id:id,idType:document.getElementById("ntype").value,name:document.getElementById("nname").value||"Unnamed patient",dob:document.getElementById("ndob").value||"Unknown",sex:"Not recorded",nationality:document.getElementById("nnat").value||"Unknown",residence:document.getElementById("nres").value||"Unknown",phone:document.getElementById("nphone").value||"Not provided",town:document.getElementById("ntown").value||"Not provided",emergency:"Not provided",coverage:{type:document.getElementById("nfund").value,provider:document.getElementById("nprovider").value||"Not recorded",member:"Pending",verified:"Pending verification"},billing:{invoice:"Not generated",encounterCharge:"N$ 0.00",claim:"Not started",patientBalance:"N$ 0.00",payment:"Not started"},allergies:[],conditions:[],meds:[],history:[],labs:[],dependants:[]};P[id]=p;savePatients();S.patient=p;S.newIdentifier="";S.tab="summary";log("Created "+vn);S.page="patient";render()}
function billing(){var ps=Object.keys(P).map(function(k){return P[k]}),s='<h1 class="title">Billing Dashboard</h1><p class="subtitle">Financial and coverage information only. Detailed clinical records are not shown.</p><div class="grid g4">'+kpi("Patients",ps.length)+kpi("Pending payments",ps.filter(function(p){return p.billing.payment.indexOf("Pending")>=0||p.billing.payment.indexOf("Awaiting")>=0}).length)+kpi("Claims requiring action",ps.filter(function(p){return p.billing.claim.indexOf("pending")>=0||p.billing.claim.indexOf("required")>=0||p.billing.claim.indexOf("Ready")>=0}).length)+kpi("Role","Billing only")+'</div><div class="card" style="margin-top:17px"><div class="tablewrap"><table><tr><th>Patient</th><th>VeriNam ID</th><th>Funding</th><th>Provider</th><th>Coverage</th><th>Invoice</th><th>Charge</th><th>Claim</th><th>Balance</th><th></th></tr>';ps.forEach(function(p){s+='<tr><td>'+E(p.name)+'</td><td>'+E(p.vn)+'</td><td>'+E(p.coverage.type)+'</td><td>'+E(p.coverage.provider)+'</td><td>'+E(p.coverage.verified)+'</td><td>'+E(p.billing.invoice)+'</td><td>'+E(p.billing.encounterCharge)+'</td><td>'+E(p.billing.claim)+'</td><td>'+E(p.billing.patientBalance)+'</td><td><button class="secondary" onclick="billingPatient(''+E(p.id)+'')">Open</button></td></tr>'});return s+'</table></div></div>'}
window.billingPatient=function(id){S.patient=P[id];S.tab="billing";S.page="patient";render()}
function billingCard(p){return '<div class="grid g2"><div class="card"><h3>Coverage</h3>'+info("Funding type",p.coverage.type)+info("Provider",p.coverage.provider)+info("Member / policy",p.coverage.member)+info("Verification",p.coverage.verified)+'</div><div class="card"><h3>Billing</h3>'+info("Invoice / reference",p.billing.invoice)+info("Encounter charge",p.billing.encounterCharge)+info("Claim status",p.billing.claim)+info("Patient balance",p.billing.patientBalance)+info("Payment status",p.billing.payment)+'</div></div><div class="restricted" style="margin-top:17px">Clinical notes, diagnoses, laboratory results and medication details are hidden from the Billing Officer role.</div>'}
function audit(){var s='<h1 class="title">Session Audit Log</h1><div class="card"><div class="tablewrap"><table><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th></tr>';S.audit.forEach(function(a){s+='<tr><td>'+E(a[0])+'</td><td>'+E(a[1])+'</td><td>'+E(a[2])+'</td><td>'+E(a[3])+'</td></tr>'});return s+'</table></div></div>'}
render();
})();
</script></body></html>
