<html lang="en">

<style>
:root{--bg:#f4f7f6;--card:#fff;--text:#15231f;--muted:#66736f;--line:#dde5e2;--brand:#0b5d4b;--soft:#eaf5f1;--nav:#073d33;--ok:#067647;--okbg:#ecfdf3;--warn:#946200;--warnbg:#fff7db;--bad:#b42318;--badbg:#fef3f2;--shadow:0 8px 28px rgba(15,35,29,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.login-card{width:min(480px,100%);padding:28px}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}.field{margin:13px 0}.field label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.primary,.secondary,.danger{padding:10px 14px;border-radius:10px;font-weight:750;border:0}.primary{background:var(--brand);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:#34413d}.danger{background:var(--bad);color:#fff}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:var(--nav);color:#fff;padding:22px 15px;position:sticky;top:0;height:100vh}.sidebar .logo{background:#fff;color:var(--nav)}.nav{margin-top:27px;display:flex;flex-direction:column;gap:6px}.nav button{border:0;background:transparent;color:#c7d8d2;text-align:left;padding:11px 12px;border-radius:10px}.nav button:hover,.nav button.active{background:rgba(255,255,255,.11);color:#fff}.content{min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 24px;position:sticky;top:0;z-index:4}.meta{font-size:12px;color:var(--muted);text-align:right}.main{padding:26px;max-width:1450px;margin:auto}.title{font-size:28px;margin:0 0 5px}.subtitle,.muted{color:var(--muted)}.subtitle{margin:0 0 21px}.grid{display:grid;gap:17px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{padding:19px}.card h3{margin-top:0}.kpi{font-size:22px;font-weight:800;margin-top:5px}.search{display:grid;grid-template-columns:1fr auto;gap:9px}.search input{padding:12px;border:1px solid var(--line);border-radius:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.label{font-size:12px;color:var(--muted)}.value{font-weight:750;margin-top:3px}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.info{background:var(--soft);color:var(--brand)}.actions,.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin:17px 0}.tabs button{background:#fff;border:1px solid var(--line);padding:8px 11px;border-radius:9px;color:#52605c}.tabs button.active{background:var(--soft);color:var(--brand);font-weight:750}.restricted{padding:14px;border-radius:12px;background:#fafafa;border:1px dashed #c7d0cd;color:var(--muted)}.queue-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px}.queue-top,.patient-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.steps{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}.step{padding:5px 8px;border-radius:8px;background:#f2f4f3;color:#6b7773;font-size:11px;font-weight:750}.step.current{background:var(--soft);color:var(--brand);outline:1px solid #a8d3c6}.step.done{background:var(--okbg);color:var(--ok)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);font-size:14px;text-align:left;white-space:nowrap}th{background:#fafafa;color:var(--muted)}.clinical{background:linear-gradient(135deg,#0b5d4b,#0a735b);color:#fff;border-radius:18px;padding:20px;margin-bottom:17px}.clinical .muted{color:#d6ebe4}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.profile-card{border:1px solid var(--line);border-radius:13px;padding:14px;margin:9px 0;background:#fff}@media(max-width:950px){.shell{grid-template-columns:1fr}.sidebar{display:none}.g4,.g3,.g2,.formgrid{grid-template-columns:1fr}.main{padding:17px}.top{padding:0 15px}.patient-head,.queue-top{flex-direction:column}.search{grid-template-columns:1fr}}
</style>
</head>

};
let P=(()=>{try{return JSON.parse(localStorage.getItem("verinam_v5_patients")||"null")||seed}catch(e){return seed}})();
const roles={receptionist:"Receptionist",nurse:"Nurse / Clinician",doctor:"Doctor",billing:"Billing Officer",admin:"System Administrator"};
let S={user:null,page:"dashboard",patient:null,enc:null,tab:"summary",audit:[],newIdentifier:""};
const app=document.getElementById("app");
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function getQ(){try{return JSON.parse(localStorage.getItem("verinam_v5_queue")||"[]")}catch(e){return[]}}
function saveQ(q){localStorage.setItem("verinam_v5_queue",JSON.stringify(q))}
function saveP(){localStorage.setItem("verinam_v5_patients",JSON.stringify(P))}
function log(a){if(S.user)S.audit.unshift([new Date().toLocaleString(),S.user.name,roles[S.user.role],a])}
function info(a,b){return `<div class="row"><div><div class="label">${esc(a)}</div><div class="value">${esc(b)}</div></div></div>`}
function field(id,l,v=""){return `<div class="field"><label>${esc(l)}</label><input id="${id}" value="${esc(v)}"></div>`}
function selectField(id,l,items){return `<div class="field"><label>${esc(l)}</label><select id="${id}">${items.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div>`}
function button(label,action,cls="primary",extra=""){return `<button class="${cls}" data-action="${action}" ${extra}>${label}</button>`}
function nav(page,label){return `<button class="${S.page===page?"active":""}" data-action="go" data-page="${page}">${label}</button>`}
function render(){app.innerHTML=S.user?shell():login()}
function login(){return `<div class="login"><div class="login-card"><div class="brand"><div class="logo">V</div><div><b>VeriNam</b><div class="muted">Healthcare prototype v5</div></div></div><h1>Secure access</h1>${field("ln","Name","Demo User")}<div class="field"><label>Role</label><select id="lr"><option value="receptionist">Receptionist</option><option value="nurse">Nurse / Clinician</option><option value="doctor">Doctor</option><option value="billing">Billing Officer</option><option value="admin">System Administrator</option></select></div><div class="field"><label>Facility</label><select id="lf"><option>Windhoek Central Hospital</option><option>Oshakati Intermediate Hospital</option><option>Rundu Intermediate Hospital</option><option>Walvis Bay State Hospital</option><option>Small Community Clinic</option></select></div>${button("Sign in","signin","primary",'style="width:100%"')}</div></div>`}
function shell(){let links=nav("dashboard","Dashboard")+nav("find","Scan / Find Patient")+nav("queue","Today's Encounters");if(["receptionist","admin"].includes(S.user.role))links+=nav("register","Create New Patient");if(S.user.role==="billing")links+=nav("billing","Billing Dashboard");links+=nav("audit","Audit Log")+button("Sign out","logout","secondary");return `<div class="shell"><aside class="sidebar"><div class="brand"><div class="logo">V</div><b>VeriNam</b></div><div class="nav">${links}</div></aside><section class="content"><header class="top"><div><b>VeriNam</b><div class="muted" style="font-size:12px">Flexible care · linked identity · role-based access</div></div><div class="meta">${esc(S.user.name)}<br>${esc(roles[S.user.role])} · ${esc(S.user.facility)}</div></header><main class="main">${page()}</main></section></div>`}
function page(){if(S.page==="find")return findPage();if(S.page==="queue")return queuePage();if(S.page==="patient")return patientPage();if(S.page==="clinical")return clinicalPage();if(S.page==="register")return registerPage();if(S.page==="billing")return billingPage();if(S.page==="audit")return auditPage();return dashboard()}
function qForFacility(){return getQ().filter(x=>x.facility===S.user.facility)}
function kpi(a,b){return `<div class="card"><div class="muted">${esc(a)}</div><div class="kpi">${esc(b)}</div></div>`}
function dashboard(){const q=qForFacility();return `<h1 class="title">${S.user.role==="nurse"?"Nurse / Clinic Dashboard":"Healthcare Dashboard"}</h1><p class="subtitle">${esc(S.user.facility)}</p><div class="grid g4">${kpi("Open encounters",q.filter(x=>x.status!=="Completed").length)}${kpi("Ready for clinician",q.filter(x=>x.status==="Ready for Clinician").length)}${kpi("With clinician",q.filter(x=>x.status==="With Clinician").length)}${kpi("Completed",q.filter(x=>x.status==="Completed").length)}</div><div class="grid g2" style="margin-top:17px"><div class="card"><h3>Find patient</h3><div class="search"><input id="searchBox" placeholder="ID / passport / birth record / VeriNam ID">${button("Find","lookup")}</div><p class="muted">Try: 90051400123, P99887766, BR-2022-00088, 76010100111, 92030300444, NL4400221, TOURIST8891, 55070700999</p></div><div class="card"><h3>Flexible care pathways</h3><p class="muted">A nurse can treat and complete an encounter without a doctor, or escalate when necessary.</p>${button("Open encounters","go","secondary",'data-page="queue"')}</div></div>`}
function findPage(){return `<h1 class="title">Scan / Find Patient</h1><p class="subtitle">Search across supported identity types.</p><div class="card"><div class="search"><input id="searchBox" placeholder="Identifier or VeriNam ID">${button("Search","lookup")}</div></div>`}
function patientPage(){const p=S.patient;if(!p)return `<div class="restricted">No patient selected.</div>`;let tabs=button("Summary","tab","secondary",'data-tab="summary"')+button("Dependants / Guardian","tab","secondary",'data-tab="family"');if(S.user.role==="billing")tabs+=button("Billing","tab","secondary",'data-tab="billing"');return `<div class="patient-head"><div><h1 class="title">${esc(p.name)}</h1><p class="subtitle">${esc(p.vn)} · ${esc(p.idType)} ${esc(p.id)} · ${esc(p.dob)} · ${esc(p.nationality)}</p></div><span class="badge ok">Profile active</span></div><div class="tabs">${tabs}</div>${patientTab(p)}`}
function patientTab(p){if(S.tab==="family")return familyCard(p);if(S.tab==="billing")return billingCard(p);let s=`<div class="grid g2"><div class="card"><h3>Identity & contact</h3>${info("Residence status",p.residence)}${info("Phone",p.phone)}${info("Town",p.town)}${info("Emergency contact",p.emergency)}</div><div class="card"><h3>Coverage summary</h3>${info("Funding",p.coverage.type)}${info("Provider",p.coverage.provider)}${info("Coverage status",p.coverage.verified)}</div></div>`;if(S.user.role==="receptionist")s+=visitBox(false);if(S.user.role==="nurse")s+=visitBox(true);if(S.user.role==="doctor")s+=`<div class="restricted" style="margin-top:17px">Open the patient from Today's Encounters when ready for a doctor.</div>`;return s}
function visitBox(nurse){return `<div class="card" style="margin-top:17px"><h3>${nurse?"Nurse-led care":"Start today's visit"}</h3>${nurse?'<p class="muted">The nurse can assess, treat and complete, or escalate to a doctor.</p>':""}<div class="field"><label>Reason for visit</label><input id="reason" value="General consultation"></div>${button(nurse?"Start nurse-led encounter":"Check in patient","startVisit","primary",`data-nurse="${nurse}"`)}</div>`}
function familyCard(p){let d=`<div class="grid g2"><div class="card"><h3>Dependants</h3>`;if(p.dependants?.length){for(const x of p.dependants){const c=P[x.id];if(c)d+=`<div class="profile-card"><b>${esc(c.name)}</b><div class="muted">${esc(x.relationship)} · ${esc(c.dob)} · ${esc(c.vn)}</div>${button("Open dependant","openPatient","secondary",`data-id="${esc(c.id)}"`)}</div>`}}else d+=`<div class="muted">No linked dependants.</div>`;d+=`</div><div class="card"><h3>Guardian / responsible adult</h3>`;if(p.guardian){const g=P[p.guardian.id];d+=info("Name",g?.name||"Unknown")+info("Relationship",p.guardian.relationship)+info("VeriNam ID",g?.vn||"Unknown");if(g)d+=button("Open guardian","openPatient","secondary",`data-id="${esc(g.id)}"`)}else d+=`<div class="muted">No guardian recorded.</div>`;return d+`</div></div>`}
function queuePage(){const q=qForFacility();let s=`<h1 class="title">Today's Encounters</h1><p class="subtitle">The workflow adapts to available staff and care pathway.</p>`;if(!q.length)return s+`<div class="card muted">No encounters at this facility yet.</div>`;for(const e of q){s+=`<div class="queue-card"><div class="queue-top"><div><div class="value">${esc(e.name)}</div><div class="label">${esc(e.vn)} · ${esc(e.reason)} · ${esc(e.path)}</div></div><span class="badge ${e.status==="Completed"?"ok":"info"}">${esc(e.status)}</span></div><div class="steps">${steps(e)}</div><div class="actions" style="margin-top:12px">${queueActions(e)}</div></div>`}return s}
function steps(e){const a=e.path==="Nurse-led"?["With Clinician","Completed"]:["Checked In","Triage","Ready for Clinician","With Clinician","Completed"];const i=a.indexOf(e.status);return a.map((x,n)=>`<span class="step ${n<i?"done":n===i?"current":""}">${esc(x)}</span>`).join("")}
function queueActions(e){if(e.status==="Completed")return `<span class="muted">Encounter completed.</span>`;if(S.user.role==="nurse"){if(e.status==="Checked In")return button("Start triage","setStatus","primary",`data-id="${e.id}" data-status="Triage"`)+button("Treat directly","openClinical","secondary",`data-id="${e.id}"`);if(e.status==="Triage")return button("Treat patient","openClinical","primary",`data-id="${e.id}"`)+button("Escalate to doctor","setStatus","secondary",`data-id="${e.id}" data-status="Ready for Clinician"`);if(e.status==="With Clinician")return button("Continue care","openClinical","primary",`data-id="${e.id}"`)}if(S.user.role==="doctor"&&e.status==="Ready for Clinician")return button("Open Clinical View","openClinical","primary",`data-id="${e.id}"`);if(S.user.role==="doctor"&&e.status==="With Clinician")return button("Continue Clinical View","openClinical","primary",`data-id="${e.id}"`);return `<span class="muted">Waiting for next authorised step.</span>`}
function clinicalPage(){const p=S.patient,e=getQ().find(x=>x.id===S.enc);if(!p||!e)return `<div class="restricted">No encounter selected.</div>`;return `<div class="clinical"><div class="muted">CLINICAL VIEW · ${esc(e.path.toUpperCase())}</div><h1 style="margin:5px 0">${esc(p.name)}</h1><div>${esc(p.vn)} · ${esc(e.reason)}</div></div><div class="grid g3"><div class="card"><h3>Safety summary</h3>${info("Allergies",p.allergies.join(", ")||"None recorded")}${info("Conditions",p.conditions.join(", ")||"None recorded")}${info("Medication",p.meds.join(", ")||"None recorded")}</div><div class="card"><h3>Recent labs</h3>${p.labs.length?p.labs.map(x=>`<div class="row">${esc(x)}</div>`).join(""):'<div class="muted">No recent results.</div>'}</div><div class="card"><h3>Assessment / treatment</h3><div class="field"><label>Clinical note</label><textarea id="note" rows="5"></textarea></div></div></div><div class="card" style="margin-top:17px"><h3>Previous encounters</h3><div class="tablewrap"><table><tr><th>Date</th><th>Facility</th><th>Reason</th><th>Diagnosis</th></tr>${p.history.map(h=>`<tr><td>${esc(h[0])}</td><td>${esc(h[1])}</td><td>${esc(h[2])}</td><td>${esc(h[3])}</td></tr>`).join("")}</table></div><div class="actions" style="margin-top:14px">${S.user.role==="nurse"?button("Escalate to doctor","escalate","secondary"):""}${button("Treat & Complete","complete")}</div></div>`}
function registerPage(){return `<h1 class="title">Create New Patient</h1><p class="subtitle">First-time registration generates a VeriNam ID and stores the profile in this browser.</p><div class="card"><div class="formgrid">${field("nid","Identity / document number",S.newIdentifier)}${selectField("ntype","Identity type",["Namibian ID","Passport","Birth record","Residence document","Temporary / no document"])}${field("nname","Full legal name")}${field("ndob","Date of birth")}${field("nnat","Nationality","Namibian")}${field("nres","Residence status","Citizen")}${field("nphone","Phone")}${field("ntown","Town / address")}${selectField("nfund","Funding",["State patient","No insurance / public patient","PSEMAS","Private medical aid","Self-pay","Foreign/travel insurance","Unknown"])}${field("nprovider","Provider / scheme")}</div>${button("Create VeriNam profile","createPatient")}</div>`}
function billingPage(){const ps=Object.values(P);let rows=ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.vn)}</td><td>${esc(p.coverage.type)}</td><td>${esc(p.coverage.provider)}</td><td>${esc(p.coverage.verified)}</td><td>${esc(p.billing.invoice)}</td><td>${esc(p.billing.charge)}</td><td>${esc(p.billing.claim)}</td><td>${esc(p.billing.balance)}</td><td>${button("Open","billingPatient","secondary",`data-id="${esc(p.id)}"`)}</td></tr>`).join("");return `<h1 class="title">Billing Dashboard</h1><p class="subtitle">Financial and coverage information only. Detailed clinical records are hidden.</p><div class="grid g4">${kpi("Patients",ps.length)}${kpi("Pending payments",ps.filter(p=>/Pending|Awaiting/.test(p.billing.payment)).length)}${kpi("Claims requiring action",ps.filter(p=>/pending|required|Ready/i.test(p.billing.claim)).length)}${kpi("Role","Billing only")}</div><div class="card" style="margin-top:17px"><div class="tablewrap"><table><tr><th>Patient</th><th>VeriNam ID</th><th>Funding</th><th>Provider</th><th>Coverage</th><th>Invoice</th><th>Charge</th><th>Claim</th><th>Balance</th><th></th></tr>${rows}</table></div></div>`}
function billingCard(p){return `<div class="grid g2"><div class="card"><h3>Coverage</h3>${info("Funding type",p.coverage.type)}${info("Provider",p.coverage.provider)}${info("Member / policy",p.coverage.member)}${info("Verification",p.coverage.verified)}</div><div class="card"><h3>Billing</h3>${info("Invoice / reference",p.billing.invoice)}${info("Encounter charge",p.billing.charge)}${info("Claim status",p.billing.claim)}${info("Patient balance",p.billing.balance)}${info("Payment status",p.billing.payment)}</div></div><div class="restricted" style="margin-top:17px">Clinical notes, diagnoses, laboratory results and medication details are hidden from the Billing Officer role.</div>`}
function auditPage(){return `<h1 class="title">Session Audit Log</h1><div class="card"><div class="tablewrap"><table><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th></tr>${S.audit.map(a=>`<tr><td>${esc(a[0])}</td><td>${esc(a[1])}</td><td>${esc(a[2])}</td><td>${esc(a[3])}</td></tr>`).join("")}</table></div></div>`}
app.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action;if(a==="signin"){S.user={name:document.getElementById("ln").value||"Demo User",role:document.getElementById("lr").value,facility:document.getElementById("lf").value};log("Signed in");S.page=S.user.role==="billing"?"billing":S.user.role==="doctor"?"queue":"dashboard";render()}else if(a==="logout"){S={user:null,page:"dashboard",patient:null,enc:null,tab:"summary",audit:S.audit,newIdentifier:""};render()}else if(a==="go"){S.page=b.dataset.page;render()}else if(a==="lookup"){const input=document.getElementById("searchBox");const q=(input?.value||"").trim();let p=P[q]||Object.values(P).find(x=>x.vn===q);if(!p){if(["receptionist","admin"].includes(S.user.role)){S.newIdentifier=q;S.page="register";render()}else alert("No matching patient. Reception can create a new profile.");return}S.patient=p;S.tab="summary";log("Opened "+p.vn);S.page="patient";render()}else if(a==="tab"){S.tab=b.dataset.tab;render()}else if(a==="openPatient"){S.patient=P[b.dataset.id];S.tab="summary";render()}else if(a==="startVisit"){const nurse=b.dataset.nurse==="true";const q=getQ();const enc={id:"ENC-"+Date.now(),patientId:S.patient.id,vn:S.patient.vn,name:S.patient.name,facility:S.user.facility,reason:document.getElementById("reason").value||"General consultation",status:nurse?"With Clinician":"Checked In",path:nurse?"Nurse-led":"Hospital",created:new Date().toLocaleString()};q.push(enc);saveQ(q);S.enc=enc.id;log("Started "+enc.path+" encounter for "+enc.vn);S.page=nurse?"clinical":"queue";render()}else if(a==="setStatus"){const q=getQ();for(const x of q)if(x.id===b.dataset.id)x.status=b.dataset.status;saveQ(q);render()}else if(a==="openClinical"){const q=getQ();const enc=q.find(x=>x.id===b.dataset.id);if(!enc)return;enc.status="With Clinician";saveQ(q);S.enc=enc.id;S.patient=P[enc.patientId];S.page="clinical";render()}else if(a==="escalate"){const q=getQ();for(const x of q)if(x.id===S.enc)x.status="Ready for Clinician";saveQ(q);S.page="queue";render()}else if(a==="complete"){const q=getQ();for(const x of q)if(x.id===S.enc){x.status="Completed";x.note=document.getElementById("note")?.value||""}saveQ(q);S.page="queue";render()}else if(a==="createPatient"){const id=document.getElementById("nid").value.trim()||("TMP-"+Date.now());if(P[id]){alert("That identifier already exists.");return}const vn="VN-"+Math.floor(10000000+Math.random()*89999999);P[id]={vn,id,idType:document.getElementById("ntype").value,name:document.getElementById("nname").value||"Unnamed patient",dob:document.getElementById("ndob").value||"Unknown",nationality:document.getElementById("nnat").value||"Unknown",residence:document.getElementById("nres").value||"Unknown",phone:document.getElementById("nphone").value||"Not provided",town:document.getElementById("ntown").value||"Not provided",emergency:"Not provided",coverage:{type:document.getElementById("nfund").value,provider:document.getElementById("nprovider").value||"Not recorded",member:"Pending",verified:"Pending verification"},billing:{invoice:"Not generated",charge:"N$ 0.00",claim:"Not started",balance:"N$ 0.00",payment:"Not started"},allergies:[],conditions:[],meds:[],history:[],labs:[],dependants:[]};saveP();S.patient=P[id];S.tab="summary";S.page="patient";render()}else if(a==="billingPatient"){S.patient=P[b.dataset.id];S.tab="billing";S.page="patient";render()}})
render();
})();
</script>
</body>
</html>
