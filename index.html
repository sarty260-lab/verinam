<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VeriNam v5</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7f6;color:#15231f}
header{background:#fff;border-bottom:1px solid #dde5e2;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}
.wrap{max-width:1180px;margin:24px auto;padding:0 16px}
.card{background:#fff;border:1px solid #dde5e2;border-radius:14px;padding:18px;margin-bottom:16px}
h1,h2,h3{margin-top:0}
.muted{color:#66736f}.small{font-size:13px}.logo{font-weight:bold;color:#0b5d4b;font-size:23px}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cfd8d4;border-radius:8px;margin:5px 0 12px}
button{border:0;border-radius:8px;padding:10px 13px;font-weight:bold;cursor:pointer;margin:3px;background:#0b5d4b;color:#fff}
button.secondary{background:#fff;color:#34413d;border:1px solid #cfd8d4}
button.danger{background:#b42318}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.row{padding:10px 0;border-bottom:1px solid #edf0ef}.row:last-child{border:0}
.label{font-size:12px;color:#66736f}.value{font-weight:bold;margin-top:3px}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold;background:#ecfdf3;color:#067647}
.warn{background:#fff7db;color:#946200}
.tabs{margin:12px 0}.tabs button{background:#fff;color:#0b5d4b;border:1px solid #cfd8d4}
.queue{background:#fff;border:1px solid #dde5e2;border-radius:12px;padding:14px;margin:10px 0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #edf0ef;font-size:14px}
th{color:#66736f;background:#fafafa}
.hidden{display:none}
@media(max-width:800px){.grid,.grid4{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="userInfo" class="small muted">Not signed in</div>
</header>
<div class="wrap"><div id="app"></div></div>

<script>

 emergency:"Lukas //Garoëb · +264 81 606 0303",
 coverage:{type:"State patient",provider:"Public healthcare",member:"N/A",verified:"Active"},
 billing:{invoice:"INV-260810-72099",charge:"N$ 0.00",claim:"Not applicable",balance:"N$ 0.00",payment:"State-funded"},

var P;
try { P = JSON.parse(localStorage.getItem("verinam_v5_patients")) || seed; } catch(e) { P = seed; }

var S={logged:false,name:"",role:"receptionist",facility:"Windhoek Central Hospital",page:"dashboard",patient:null,encounterId:null,tab:"summary"};

function qload(){try{return JSON.parse(localStorage.getItem("verinam_v5_queue")||"[]")}catch(e){return[]}}
function qsave(q){localStorage.setItem("verinam_v5_queue",JSON.stringify(q))}
function psave(){localStorage.setItem("verinam_v5_patients",JSON.stringify(P))}
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function roleName(){if(S.role==="nurse")return "Nurse / Clinician";if(S.role==="doctor")return "Doctor";if(S.role==="billing")return "Billing Officer";if(S.role==="admin")return "System Administrator";return "Receptionist"}
function info(label,value){return '<div class="row"><div class="label">'+esc(label)+'</div><div class="value">'+esc(value)+'</div></div>'}
function render(){document.getElementById("userInfo").innerHTML=S.logged?esc(S.name)+" · "+roleName()+" · "+esc(S.facility):"Not signed in";document.getElementById("app").innerHTML=S.logged?screen():login()}
function login(){return '<div class="card" style="max-width:470px;margin:35px auto"><h1>VeriNam v5</h1><p class="muted">Healthcare prototype</p><label>Name</label><input id="ln" value="Demo User"><label>Role</label><select id="lr"><option value="receptionist">Receptionist</option><option value="nurse">Nurse / Clinician</option><option value="doctor">Doctor</option><option value="billing">Billing Officer</option><option value="admin">System Administrator</option></select><label>Facility</label><select id="lf"><option>Windhoek Central Hospital</option><option>Oshakati Intermediate Hospital</option><option>Rundu Intermediate Hospital</option><option>Walvis Bay State Hospital</option><option>Small Community Clinic</option></select><button onclick="signin()">Sign in</button></div>'}
function signin(){S.logged=true;S.name=document.getElementById("ln").value||"Demo User";S.role=document.getElementById("lr").value;S.facility=document.getElementById("lf").value;S.page=S.role==="billing"?"billing":S.role==="doctor"?"queue":"dashboard";render()}
function nav(){return '<div class="card"><button onclick="go(\'dashboard\')">Dashboard</button><button onclick="go(\'find\')">Find Patient</button><button onclick="go(\'queue\')">Today\'s Encounters</button>'+(S.role==="receptionist"||S.role==="admin"?'<button onclick="go(\'register\')">Create New Patient</button>':'')+(S.role==="billing"?'<button onclick="go(\'billing\')">Billing Dashboard</button>':'')+'<button class="secondary" onclick="logout()">Sign out</button></div>'}
function logout(){S.logged=false;S.patient=null;S.encounterId=null;S.page="dashboard";render()}
function go(p){S.page=p;render()}
function screen(){return nav()+page()}
function page(){if(S.page==="find")return findPage();if(S.page==="queue")return queuePage();if(S.page==="patient")return patientPage();if(S.page==="clinical")return clinicalPage();if(S.page==="register")return registerPage();if(S.page==="billing")return billingPage();return dashboard()}
function dashboard(){var q=qload().filter(function(x){return x.facility===S.facility});return '<h1>Healthcare Dashboard</h1><div class="grid4"><div class="card"><div class="muted">Open encounters</div><h2>'+q.filter(function(x){return x.status!=="Completed"}).length+'</h2></div><div class="card"><div class="muted">Ready for clinician</div><h2>'+q.filter(function(x){return x.status==="Ready for Clinician"}).length+'</h2></div><div class="card"><div class="muted">With clinician</div><h2>'+q.filter(function(x){return x.status==="With Clinician"}).length+'</h2></div><div class="card"><div class="muted">Completed</div><h2>'+q.filter(function(x){return x.status==="Completed"}).length+'</h2></div></div><div class="card"><h3>Find patient</h3><input id="search" placeholder="ID / passport / birth record / VeriNam ID"><button onclick="lookup()">Find</button><p class="muted small">Try 90051400123, P99887766, BR-2022-00088, 76010100111, 92030300444, NL4400221, TOURIST8891, 55070700999</p></div>'}
function findPage(){return '<h1>Find Patient</h1><div class="card"><input id="search" placeholder="Identifier or VeriNam ID"><button onclick="lookup()">Search</button></div>'}
function lookup(){var q=(document.getElementById("search").value||"").trim();var p=P[q];if(!p){for(var k in P){if(P[k].vn===q){p=P[k];break}}}if(!p){if(S.role==="receptionist"||S.role==="admin"){S.newIdentifier=q;S.page="register";render()}else{alert("No matching patient. Reception can create a new profile.");}return}S.patient=p;S.tab="summary";S.page="patient";render()}
function patientPage(){var p=S.patient;if(!p)return '<div class="card">No patient selected.</div>';var tabs='<div class="tabs"><button onclick="tab(\'summary\')">Summary</button><button onclick="tab(\'family\')">Dependants / Guardian</button>'+(S.role==="billing"?'<button onclick="tab(\'billing\')">Billing</button>':'')+'</div>';return '<h1>'+esc(p.name)+'</h1><p class="muted">'+esc(p.vn)+' · '+esc(p.idType)+' '+esc(p.id)+' · '+esc(p.dob)+' · '+esc(p.nationality)+'</p>'+tabs+patientTab(p)}
function tab(t){S.tab=t;render()}
function patientTab(p){if(S.tab==="family")return family(p);if(S.tab==="billing")return billingCard(p);var x='<div class="grid"><div class="card"><h3>Identity & contact</h3>'+info("Residence",p.residence)+info("Phone",p.phone)+info("Town",p.town)+info("Emergency contact",p.emergency)+'</div><div class="card"><h3>Coverage</h3>'+info("Funding",p.coverage.type)+info("Provider",p.coverage.provider)+info("Status",p.coverage.verified)+'</div></div>';if(S.role==="receptionist")x+='<div class="card"><h3>Start today\'s visit</h3><input id="reason" value="General consultation"><button onclick="startVisit(false)">Check in patient</button></div>';if(S.role==="nurse")x+='<div class="card"><h3>Nurse-led care</h3><p class="muted">Assess, treat and complete here, or escalate to a doctor.</p><input id="reason" value="General consultation"><button onclick="startVisit(true)">Start nurse-led encounter</button></div>';return x}
function family(p){var x='<div class="grid"><div class="card"><h3>Dependants</h3>';if(p.dependants&&p.dependants.length){for(var i=0;i<p.dependants.length;i++){var c=P[p.dependants[i].id];if(c)x+='<div class="row"><div><b>'+esc(c.name)+'</b><div class="muted small">'+esc(p.dependants[i].relationship)+' · '+esc(c.vn)+'</div></div><button class="secondary" onclick="openPatient(\''+esc(c.id)+'\')">Open</button></div>'}}else{x+='<p class="muted">No linked dependants.</p>'}x+='</div><div class="card"><h3>Guardian</h3>';if(p.guardian){var g=P[p.guardian.id];x+=info("Name",g?g.name:"Unknown")+info("Relationship",p.guardian.relationship)+info("VeriNam ID",g?g.vn:"Unknown")}else{x+='<p class="muted">No guardian recorded.</p>'}return x+'</div></div>'}
function openPatient(id){S.patient=P[id];S.tab="summary";render()}
function startVisit(nurse){var q=qload();var e={id:"ENC-"+Date.now(),patientId:S.patient.id,vn:S.patient.vn,name:S.patient.name,facility:S.facility,reason:document.getElementById("reason").value||"General consultation",status:nurse?"With Clinician":"Checked In",path:nurse?"Nurse-led":"Hospital",created:new Date().toLocaleString()};q.push(e);qsave(q);S.encounterId=e.id;S.page=nurse?"clinical":"queue";render()}
function facilityQueue(){return qload().filter(function(x){return x.facility===S.facility})}
function queuePage(){var q=facilityQueue(),x='<h1>Today\'s Encounters</h1>';if(!q.length)return x+'<div class="card muted">No encounters yet.</div>';for(var i=0;i<q.length;i++){var e=q[i];x+='<div class="queue"><b>'+esc(e.name)+'</b><div class="muted small">'+esc(e.vn)+' · '+esc(e.reason)+' · '+esc(e.path)+'</div><div style="margin:8px 0"><span class="badge">'+esc(e.status)+'</span></div>'+queueActions(e)+'</div>'}return x}
function queueActions(e){if(e.status==="Completed")return '<span class="muted">Completed</span>';if(S.role==="nurse"){if(e.status==="Checked In")return '<button onclick="setStatus(\''+e.id+'\',\'Triage\')">Start triage</button><button class="secondary" onclick="openClinical(\''+e.id+'\')">Treat directly</button>';if(e.status==="Triage")return '<button onclick="openClinical(\''+e.id+'\')">Treat patient</button><button class="secondary" onclick="setStatus(\''+e.id+'\',\'Ready for Clinician\')">Escalate to doctor</button>';if(e.status==="With Clinician")return '<button onclick="openClinical(\''+e.id+'\')">Continue care</button>'}if(S.role==="doctor"&&(e.status==="Ready for Clinician"||e.status==="With Clinician"))return '<button onclick="openClinical(\''+e.id+'\')">Open Clinical View</button>';return '<span class="muted">Waiting for next step</span>'}
function setStatus(id,status){var q=qload();for(var i=0;i<q.length;i++){if(q[i].id===id)q[i].status=status}qsave(q);render()}
function openClinical(id){var q=qload(),e=null;for(var i=0;i<q.length;i++){if(q[i].id===id){e=q[i];q[i].status="With Clinician"}}if(!e)return;qsave(q);S.encounterId=id;S.patient=P[e.patientId];S.page="clinical";render()}
function clinicalPage(){var p=S.patient,q=qload(),e=null;for(var i=0;i<q.length;i++){if(q[i].id===S.encounterId)e=q[i]}if(!p||!e)return '<div class="card">No encounter selected.</div>';var labs=p.labs.length?p.labs.join("<br>"):"No recent results";var hist="";for(var j=0;j<p.history.length;j++){hist+='<tr><td>'+esc(p.history[j][0])+'</td><td>'+esc(p.history[j][1])+'</td><td>'+esc(p.history[j][2])+'</td><td>'+esc(p.history[j][3])+'</td></tr>'}return '<h1>Clinical View</h1><div class="grid"><div class="card"><h3>Safety summary</h3>'+info("Allergies",p.allergies.join(", ")||"None")+info("Conditions",p.conditions.join(", ")||"None")+info("Medication",p.meds.join(", ")||"None")+'</div><div class="card"><h3>Recent labs</h3>'+labs+'</div></div><div class="card"><h3>Assessment / treatment</h3><textarea id="note" rows="5"></textarea><br>'+(S.role==="nurse"?'<button class="secondary" onclick="escalate()">Escalate to doctor</button>':'')+'<button onclick="complete()">Treat & Complete</button></div><div class="card"><h3>Previous encounters</h3><table><tr><th>Date</th><th>Facility</th><th>Reason</th><th>Diagnosis</th></tr>'+hist+'</table></div>'}
function escalate(){setStatus(S.encounterId,"Ready for Clinician");S.page="queue";render()}
function complete(){var q=qload();for(var i=0;i<q.length;i++){if(q[i].id===S.encounterId){q[i].status="Completed";q[i].note=document.getElementById("note").value||""}}qsave(q);S.page="queue";render()}
function registerPage(){return '<h1>Create New Patient</h1><div class="card"><label>Identity / document number</label><input id="nid" value="'+esc(S.newIdentifier||"")+'"><label>Identity type</label><select id="ntype"><option>Namibian ID</option><option>Passport</option><option>Birth record</option><option>Residence document</option><option>Temporary / no document</option></select><label>Full legal name</label><input id="nname"><label>Date of birth</label><input id="ndob"><label>Nationality</label><input id="nnat" value="Namibian"><label>Residence status</label><input id="nres" value="Citizen"><label>Phone</label><input id="nphone"><label>Town / address</label><input id="ntown"><label>Funding</label><select id="nfund"><option>State patient</option><option>No insurance / public patient</option><option>PSEMAS</option><option>Private medical aid</option><option>Self-pay</option><option>Foreign/travel insurance</option><option>Unknown</option></select><label>Provider / scheme</label><input id="nprovider"><button onclick="createPatient()">Create VeriNam profile</button></div>'}
function createPatient(){var id=(document.getElementById("nid").value||"").trim()||("TMP-"+Date.now());if(P[id]){alert("That identifier already exists.");return}var vn="VN-"+Math.floor(10000000+Math.random()*89999999);P[id]={vn:vn,id:id,idType:document.getElementById("ntype").value,name:document.getElementById("nname").value||"Unnamed patient",dob:document.getElementById("ndob").value||"Unknown",nationality:document.getElementById("nnat").value||"Unknown",residence:document.getElementById("nres").value||"Unknown",phone:document.getElementById("nphone").value||"Not provided",town:document.getElementById("ntown").value||"Not provided",emergency:"Not provided",coverage:{type:document.getElementById("nfund").value,provider:document.getElementById("nprovider").value||"Not recorded",member:"Pending",verified:"Pending verification"},billing:{invoice:"Not generated",charge:"N$ 0.00",claim:"Not started",balance:"N$ 0.00",payment:"Not started"},allergies:[],conditions:[],meds:[],history:[],labs:[],dependants:[]};psave();S.patient=P[id];S.tab="summary";S.page="patient";render()}
function billingPage(){var rows="";for(var k in P){var p=P[k];rows+='<tr><td>'+esc(p.name)+'</td><td>'+esc(p.vn)+'</td><td>'+esc(p.coverage.type)+'</td><td>'+esc(p.coverage.provider)+'</td><td>'+esc(p.coverage.verified)+'</td><td>'+esc(p.billing.invoice)+'</td><td>'+esc(p.billing.charge)+'</td><td>'+esc(p.billing.claim)+'</td><td>'+esc(p.billing.balance)+'</td><td><button class="secondary" onclick="billingPatient(\''+esc(p.id)+'\')">Open</button></td></tr>'}return '<h1>Billing Dashboard</h1><p class="muted">Financial and coverage information only. Clinical details are hidden.</p><div class="card" style="overflow:auto"><table><tr><th>Patient</th><th>VeriNam ID</th><th>Funding</th><th>Provider</th><th>Coverage</th><th>Invoice</th><th>Charge</th><th>Claim</th><th>Balance</th><th></th></tr>'+rows+'</table></div>'}
function billingPatient(id){S.patient=P[id];S.tab="billing";S.page="patient";render()}
function billingCard(p){return '<div class="grid"><div class="card"><h3>Coverage</h3>'+info("Funding type",p.coverage.type)+info("Provider",p.coverage.provider)+info("Member / policy",p.coverage.member)+info("Verification",p.coverage.verified)+'</div><div class="card"><h3>Billing</h3>'+info("Invoice",p.billing.invoice)+info("Encounter charge",p.billing.charge)+info("Claim status",p.billing.claim)+info("Patient balance",p.billing.balance)+info("Payment status",p.billing.payment)+'</div></div><div class="card muted">Clinical notes, diagnoses, laboratory results and medication details are hidden from the Billing Officer role.</div>'}
render();
</script>
</body>
</html>
